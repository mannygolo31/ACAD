<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes"/>
<title>BLS-BidTracker Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --fh:'Sora',sans-serif; --fb:'DM Sans',sans-serif; --fm:'DM Mono',monospace;
  --bg:#f0f4f8; --sur:#ffffff; --sur2:#f7f9fc; --sur3:#eef2f7;
  --bd:#dde3ed; --bd2:#c8d0df;
  --tx:#0a1628; --tx2:#3d4f6b; --tx3:#7a8eab;
  --bl:#1d5bf7; --bl-lt:#eaf0ff; --bl-dk:#1248d6;
  --gr:#0a9261; --gr-lt:#e6f7f2; --gr-dk:#077a52;
  --rd:#d63b2f; --rd-lt:#fdf0ef;
  --am:#c47a0a; --am-lt:#fdf5e6;
  --pu:#6c35d9; --pu-lt:#f0ebff;
  --tl:#0891b2; --tl-lt:#e6f8fc;
  --r:.55rem; --rl:.8rem; --rxl:1.2rem;
  --s1:0 1px 3px rgba(10,22,40,.07),0 1px 2px rgba(10,22,40,.04);
  --s2:0 4px 16px rgba(10,22,40,.09),0 2px 4px rgba(10,22,40,.05);
  --s3:0 16px 48px rgba(10,22,40,.14),0 4px 12px rgba(10,22,40,.07);
  --sw:16rem; --tr:.17s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0b1120; --sur:#111827; --sur2:#1a2336; --sur3:#222f45;
  --bd:#2d3a50; --bd2:#3d4e68;
  --tx:#e8edf5; --tx2:#8fa3be; --tx3:#4a5f7a;
  --bl-lt:#162044; --gr-lt:#0a2419; --rd-lt:#2a1412;
  --am-lt:#251a06; --pu-lt:#1e1433; --tl-lt:#0c2228;
  --s1:0 1px 3px rgba(0,0,0,.35); --s2:0 4px 16px rgba(0,0,0,.45); --s3:0 16px 48px rgba(0,0,0,.55);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:14.5px;}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.55;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:var(--fb);font-size:inherit;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:99px;}

.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:1.5rem;}
.loader-brand{font-family:var(--fh);font-size:2rem;font-weight:700;letter-spacing:-.03em;}
.loader-brand em{color:var(--bl);font-style:normal;}
.loader-bar{width:200px;height:3px;background:var(--bd);border-radius:99px;overflow:hidden;}
.loader-prog{height:100%;background:linear-gradient(90deg,var(--bl),#6ea4ff);border-radius:99px;animation:prog 1.6s ease forwards;}
@keyframes prog{from{width:0}to{width:100%}}
.loader-msg{font-size:.82rem;color:var(--tx3);}

#toast-wrap{position:fixed;top:1.1rem;right:1.1rem;z-index:9999;display:flex;flex-direction:column;gap:.45rem;pointer-events:none;}
.toast{display:flex;align-items:flex-start;gap:.55rem;padding:.7rem .95rem;border-radius:var(--r);font-size:.8rem;font-weight:500;box-shadow:var(--s3);animation:tIn .22s ease;pointer-events:auto;min-width:220px;max-width:340px;border:1px solid transparent;}
.toast-ico{font-size:.85rem;flex-shrink:0;margin-top:1px;}
.toast-body{flex:1;}
.toast-title{font-weight:700;font-size:.79rem;margin-bottom:.1rem;}
.toast-msg{opacity:.85;font-size:.77rem;}
.toast.success{background:var(--gr-lt);color:#064e36;border-color:#6ee7c7;}
.toast.error{background:var(--rd-lt);color:#8b2318;border-color:#f9a49f;}
.toast.info{background:var(--bl-lt);color:#1239a0;border-color:#93b8fc;}
.toast.warning{background:var(--am-lt);color:#7a4b05;border-color:#f2b85a;}
@keyframes tIn{from{opacity:0;transform:translateX(1.2rem) scale(.95);}to{opacity:1;transform:none;}}
@keyframes tOut{to{opacity:0;transform:translateX(1.2rem) scale(.95);}}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:1rem;position:relative;overflow:hidden;}
.login-orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;pointer-events:none;}
.login-orb.o1{width:600px;height:600px;background:#1d5bf7;top:-160px;right:-120px;}
.login-orb.o2{width:500px;height:500px;background:#6c35d9;bottom:-160px;left:-100px;}
.login-card{background:var(--sur);border-radius:1.6rem;box-shadow:var(--s3);max-width:30rem;width:100%;padding:2.5rem 2.25rem;position:relative;z-index:1;border:1px solid var(--bd);}
.login-logo{display:flex;align-items:center;gap:.75rem;margin-bottom:2.25rem;}
.login-logo-icon{width:3.2rem;height:3.2rem;background:var(--bl);border-radius:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(29,91,247,.35);}
.login-logo-text{font-family:var(--fh);font-size:1.45rem;font-weight:700;letter-spacing:-.02em;}
.login-logo-text em{color:var(--bl);font-style:normal;}
.login-heading{font-family:var(--fh);font-size:1.6rem;font-weight:700;margin-bottom:.35rem;}
.login-sub{color:var(--tx2);font-size:.87rem;margin-bottom:1.75rem;}
.lf{margin-bottom:1rem;}
.lf label{display:block;font-size:.77rem;font-weight:700;color:var(--tx2);margin-bottom:.35rem;letter-spacing:.03em;text-transform:uppercase;}
.lf input{width:100%;padding:.72rem 1rem;border:1.5px solid var(--bd);border-radius:var(--r);font-size:.92rem;background:var(--sur);color:var(--tx);outline:none;transition:border var(--tr),box-shadow var(--tr);}
.lf input:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(29,91,247,.13);}
.login-err{color:var(--rd);font-size:.8rem;margin-bottom:.8rem;min-height:1rem;}
.btn-login{width:100%;padding:.82rem;background:var(--bl);color:#fff;border:none;border-radius:var(--r);font-weight:700;font-size:.95rem;font-family:var(--fh);cursor:pointer;letter-spacing:.02em;transition:all var(--tr);box-shadow:0 4px 14px rgba(29,91,247,.32);}
.btn-login:hover{background:var(--bl-dk);box-shadow:0 6px 20px rgba(29,91,247,.42);}
.btn-login:active{transform:scale(.99);}
.btn-login:disabled{background:#a0b8fc;box-shadow:none;cursor:not-allowed;}

.app{display:flex;min-height:100vh;}
.sidebar{width:var(--sw);background:var(--sur);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:300;transition:width var(--tr);}
.sidebar.collapsed{width:3.75rem;}
.sb-head{padding:1.25rem 1rem;flex-shrink:0;}
.sb-brand{display:flex;align-items:center;gap:.7rem;margin-bottom:1.9rem;overflow:hidden;}
.sb-brand-icon{width:2.3rem;height:2.3rem;background:var(--bl);border-radius:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(29,91,247,.3);}
.sb-brand-name{font-family:var(--fh);font-weight:700;font-size:1.05rem;white-space:nowrap;letter-spacing:-.02em;overflow:hidden;transition:opacity var(--tr);}
.sb-brand-name em{color:var(--bl);font-style:normal;}
.sidebar.collapsed .sb-brand-name{opacity:0;pointer-events:none;}
.sb-section{font-size:.63rem;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;padding:.1rem .6rem;margin:.7rem 0 .3rem;white-space:nowrap;overflow:hidden;transition:opacity var(--tr);}
.sidebar.collapsed .sb-section{opacity:0;}
.nav-item{width:100%;display:flex;align-items:center;gap:.65rem;padding:.58rem .75rem;border-radius:var(--r);background:transparent;border:none;cursor:pointer;font-size:.84rem;color:var(--tx2);transition:all var(--tr);margin-bottom:.12rem;text-align:left;white-space:nowrap;overflow:hidden;}
.nav-item:hover{background:var(--sur2);color:var(--tx);}
.nav-item.active{background:var(--bl-lt);color:var(--bl);font-weight:600;}
.nav-item .nav-ic{font-size:.98rem;flex-shrink:0;width:1.2rem;text-align:center;}
.nav-item .nav-lbl{overflow:hidden;transition:opacity var(--tr);}
.sidebar.collapsed .nav-lbl{opacity:0;pointer-events:none;}
.nav-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:.62rem;font-weight:700;padding:.1rem .38rem;border-radius:99px;flex-shrink:0;}
.sidebar.collapsed .nav-badge{display:none;}
.sb-foot{margin-top:auto;padding:.9rem;border-top:1px solid var(--bd);flex-shrink:0;}
.user-row{display:flex;align-items:center;gap:.6rem;padding:.45rem .4rem;border-radius:var(--r);overflow:hidden;margin-bottom:.45rem;}
.user-av{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--bl-lt);border:2.5px solid var(--bl);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:var(--bl);flex-shrink:0;}
.user-meta{overflow:hidden;transition:opacity var(--tr);}
.sidebar.collapsed .user-meta{opacity:0;pointer-events:none;}
.user-name{font-size:.84rem;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
.role-pill{display:inline-block;font-size:.6rem;font-weight:700;padding:.08rem .4rem;border-radius:99px;margin-top:1px;}
.role-pill.Admin{background:var(--bl-lt);color:var(--bl);}
.role-pill.Manager{background:var(--pu-lt);color:var(--pu);}
.role-pill.Viewer{background:var(--sur2);color:var(--tx3);}
.sb-action{width:100%;display:flex;align-items:center;gap:.65rem;padding:.48rem .75rem;border-radius:var(--r);background:transparent;border:none;cursor:pointer;font-size:.8rem;transition:background var(--tr);overflow:hidden;white-space:nowrap;}
.sb-action.danger{color:var(--rd);}
.sb-action.danger:hover{background:var(--rd-lt);}
.sb-action .sa-lbl{transition:opacity var(--tr);}
.sidebar.collapsed .sa-lbl{opacity:0;pointer-events:none;}
.collapse-btn{width:100%;display:flex;align-items:center;justify-content:flex-end;padding:.35rem .6rem 0;background:none;border:none;cursor:pointer;color:var(--tx3);font-size:.78rem;transition:color var(--tr);}
.collapse-btn:hover{color:var(--tx2);}

.main{flex:1;margin-left:var(--sw);padding:1.6rem 1.75rem 5.5rem;min-height:100vh;transition:margin-left var(--tr);}
.main.collapsed{margin-left:3.75rem;}

.topbar{display:flex;justify-content:flex-end;align-items:center;gap:.65rem;margin-bottom:1.25rem;}
.topbar-btn{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r);padding:.42rem .75rem;font-size:.79rem;color:var(--tx2);display:flex;align-items:center;gap:.4rem;cursor:pointer;transition:all var(--tr);box-shadow:var(--s1);}
.topbar-btn:hover{background:var(--sur2);color:var(--tx);}
.notif-wrap{position:relative;}
.notif-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--rd);border-radius:50%;border:2px solid var(--sur);}

.page-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.4rem;gap:1rem;flex-wrap:wrap;}
.page-hdr-left .page-title{font-family:var(--fh);font-size:1.45rem;font-weight:700;letter-spacing:-.02em;}
.page-hdr-left .page-sub{color:var(--tx2);font-size:.83rem;margin-top:.2rem;}
.page-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}

.stats-bar{position:fixed;bottom:0;left:var(--sw);right:0;background:var(--sur);border-top:1px solid var(--bd);padding:.52rem 1.75rem;display:flex;align-items:center;gap:.85rem;z-index:150;flex-wrap:wrap;transition:left var(--tr);box-shadow:0 -3px 16px rgba(10,22,40,.07);}
.stats-bar.collapsed{left:3.75rem;}
.stat-pill{display:flex;align-items:center;gap:.38rem;background:var(--sur2);border:1px solid var(--bd);padding:.22rem .75rem;border-radius:99px;font-size:.77rem;white-space:nowrap;}
.stat-pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.stat-pill-lbl{color:var(--tx2);font-weight:500;}
.stat-pill-val{font-weight:700;font-size:.83rem;}

.alert-strip{display:flex;align-items:center;gap:.7rem;padding:.65rem 1rem;border-radius:var(--r);font-size:.81rem;font-weight:500;margin-bottom:1.1rem;border:1px solid transparent;}
.alert-strip.warning{background:var(--am-lt);color:#7a4b05;border-color:#f2b85a;}
.alert-strip.danger{background:var(--rd-lt);color:#8b2318;border-color:#f9a49f;}
.alert-strip.info{background:var(--bl-lt);color:#1239a0;border-color:#93b8fc;}
.alert-strip.success{background:var(--gr-lt);color:#064e36;border-color:#6ee7c7;}
.alert-close{margin-left:auto;background:none;border:none;cursor:pointer;opacity:.55;font-size:1.05rem;line-height:1;transition:opacity var(--tr);}
.alert-close:hover{opacity:1;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.8rem;margin-bottom:1.2rem;}
.kpi-card{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);padding:1rem 1.15rem;box-shadow:var(--s1);position:relative;overflow:hidden;transition:box-shadow var(--tr),transform var(--tr);}
.kpi-card:hover{box-shadow:var(--s2);transform:translateY(-1px);}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--rl) var(--rl) 0 0;background:var(--kc,var(--bl));}
.kpi-icon{font-size:1.2rem;margin-bottom:.45rem;}
.kpi-lbl{font-size:.69rem;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;}
.kpi-val{font-family:var(--fh);font-size:1.25rem;font-weight:700;margin-top:.12rem;letter-spacing:-.02em;}
.kpi-sub{font-size:.69rem;color:var(--tx3);margin-top:.18rem;}
.kpi-bar{background:var(--bd);border-radius:99px;height:4px;overflow:hidden;margin-top:.45rem;}
.kpi-bar-fill{height:100%;border-radius:99px;}

.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:.9rem;margin-bottom:1.2rem;}
.chart-card{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);padding:1.2rem;box-shadow:var(--s1);}
.chart-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;}
.chart-title{font-family:var(--fh);font-size:.85rem;font-weight:600;letter-spacing:-.01em;}
.chart-sub{font-size:.69rem;color:var(--tx3);}
.chart-wrap{position:relative;height:195px;}
.chart-wrap.tall{height:235px;}

.filter-bar{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);padding:.8rem 1rem;margin-bottom:.95rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;box-shadow:var(--s1);}
.fg{display:flex;flex-direction:column;gap:.18rem;}
.fg label{font-size:.65rem;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;}
.fg select,.fg input[type="text"],.fg input[type="date"]{padding:.4rem .62rem;border:1.5px solid var(--bd);border-radius:.45rem;font-size:.8rem;background:var(--sur);color:var(--tx);outline:none;min-width:110px;transition:border var(--tr);}
.fg select:focus,.fg input:focus{border-color:var(--bl);}

.tbl-card{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--s1);}
.tbl-toolbar{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:.5rem;}
.tbl-left{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.tbl-right{display:flex;align-items:center;gap:.5rem;}
.bulk-actions{display:none;align-items:center;gap:.45rem;}
.bulk-actions.show{display:flex;}
.bulk-label{font-size:.8rem;font-weight:600;color:var(--bl);}
.tbl-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:900px;}
th{text-align:left;padding:.68rem .85rem;background:var(--sur2);font-size:.64rem;font-weight:700;color:var(--tx3);border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;user-select:none;}
th.sortable{cursor:pointer;}
th.sortable:hover{color:var(--tx);}
th .sort-arrow{margin-left:.2rem;opacity:.35;font-size:.65rem;}
th.asc .sort-arrow,th.desc .sort-arrow{opacity:1;color:var(--bl);}
td{padding:.68rem .85rem;font-size:.8rem;border-bottom:1px solid var(--bd);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.sel td{background:var(--bl-lt)!important;}
tr.approved-row td{background:var(--gr-lt);}
tr.approved-row:hover td{background:#c8f4e8!important;}
tr.rejected-row td{background:var(--rd-lt);}
tr.rejected-row:hover td{background:#fde3e1!important;}
tr.success-row td{background:var(--tl-lt);}
tr.success-row:hover td{background:#b8eef8!important;}
tr:not(.sel):not(.approved-row):not(.rejected-row):not(.success-row):hover td{background:var(--sur2);}
.row-check{width:.95rem;height:.95rem;cursor:pointer;accent-color:var(--bl);}
tfoot td{border-top:2.5px solid var(--bd2)!important;border-bottom:none!important;font-weight:700;}
tfoot tr:hover td{background:var(--sur2)!important;}

.badge{display:inline-flex;align-items:center;padding:.16rem .52rem;border-radius:99px;font-size:.68rem;font-weight:700;gap:.22rem;white-space:nowrap;letter-spacing:.01em;}
.badge-proposed{background:var(--sur3);color:var(--tx2);border:1px solid var(--bd);}
.badge-submitted{background:var(--bl-lt);color:var(--bl);}
.badge-participating{background:var(--pu-lt);color:var(--pu);}
.badge-consignment{background:var(--am-lt);color:var(--am);}
.badge-rfq{background:#ecfdf5;color:#059669;border:1px solid #6ee7b7;}
.badge-bidresult{background:var(--tl-lt);color:var(--tl);}
.badge-postqual{background:#fce7f3;color:#be185d;}
.badge-approved{background:var(--gr-lt);color:var(--gr);}
.badge-rejected{background:var(--rd-lt);color:var(--rd);}
.badge-success{background:var(--tl-lt);color:var(--tl);}
.badge-warn{background:var(--am-lt);color:var(--am);}
.badge-danger{background:var(--rd-lt);color:var(--rd);}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;}

.btn{display:inline-flex;align-items:center;gap:.38rem;padding:.44rem .88rem;border-radius:.48rem;font-size:.8rem;font-weight:600;border:none;cursor:pointer;transition:all var(--tr);white-space:nowrap;letter-spacing:.01em;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--bl);color:#fff;box-shadow:0 2px 8px rgba(29,91,247,.25);}
.btn-primary:hover:not(:disabled){background:var(--bl-dk);}
.btn-success{background:var(--gr);color:#fff;box-shadow:0 2px 8px rgba(10,146,97,.22);}
.btn-success:hover:not(:disabled){background:var(--gr-dk);}
.btn-danger{background:var(--rd);color:#fff;}
.btn-danger:hover:not(:disabled){background:#b83128;}
.btn-ghost{background:transparent;color:var(--tx2);border:1.5px solid var(--bd);}
.btn-ghost:hover:not(:disabled){background:var(--sur2);border-color:var(--bd2);color:var(--tx);}
.btn-excel{background:var(--gr-lt);color:var(--gr);border:1px solid #6ee7c7;}
.btn-excel:hover{background:#c8f4e8;}
.btn-pdf{background:var(--rd-lt);color:var(--rd);border:1px solid #f9a49f;}
.btn-pdf:hover{background:#fde3e1;}
.btn-print{background:var(--pu-lt);color:var(--pu);border:1px solid #c4b5fd;}
.btn-print:hover{background:#e8ddff;}
.btn-sm{padding:.28rem .62rem;font-size:.76rem;}
.btn-xs{padding:.2rem .5rem;font-size:.72rem;}
.icon-btn{background:transparent;border:none;cursor:pointer;padding:.24rem;border-radius:.35rem;font-size:.88rem;color:var(--tx3);transition:all var(--tr);display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--sur2);color:var(--tx);}
.icon-btn.danger:hover{background:var(--rd-lt);color:var(--rd);}
.approve-cb{width:1rem;height:1rem;accent-color:var(--gr);cursor:pointer;}
.reject-cb{width:1rem;height:1rem;accent-color:var(--rd);cursor:pointer;}
.success-cb{width:1rem;height:1rem;accent-color:var(--tl);cursor:pointer;}

.form-panel{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--s2);animation:slideDown .2s ease;overflow:hidden;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
.form-header{background:var(--sur2);border-bottom:1px solid var(--bd);padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.form-header-title{font-family:var(--fh);font-size:.92rem;font-weight:700;}
.form-body{padding:1.25rem;}
.form-section{margin-bottom:1.35rem;}
.form-section-title{font-size:.68rem;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;padding-bottom:.4rem;border-bottom:1px solid var(--bd);margin-bottom:.85rem;}

function deadlineTag(deadline){
  if(!deadline)return'';
  const d=new Date(deadline);const now=new Date();
  const diff=Math.ceil((d-now)/(1000*60*60*24));
  if(diff<0)return'<span class="deadline-tag overdue">&#9200; '+fmtD(deadline)+' \u00b7 Overdue</span>';
  if(diff<=7)return'<span class="deadline-tag upcoming">&#9200; '+fmtD(deadline)+' \u00b7 '+diff+'d left</span>';
  return'<span class="deadline-tag ok">&#9200; '+fmtD(deadline)+'</span>';
}
function deadlineColor(deadline){
  if(!deadline)return'var(--tx3)';
  const diff=Math.ceil((new Date(deadline)-new Date())/(1000*60*60*24));
  return diff<0?'var(--rd)':diff<=7?'var(--am)':'var(--gr)';
}

function statusBadgeCls(s){
  if(SUCCESS_STATUSES.includes(s))return'badge-success';
  if(FAIL_STATUSES.includes(s))return'badge-danger';
  if(['Approved'].includes(s))return'badge-approved';
  if(['Submitted For Approval','Processing Bid Docs','Submitted for COGS'].includes(s))return'badge-submitted';

function toast(msg,type,title){
  type=type||'success';
  const icons={success:'\u2713',error:'\u2715',warning:'\u26a0',info:'\u2139'};
  const def={success:'Success',error:'Error',warning:'Warning',info:'Info'};
  const w=document.getElementById('toast-wrap');if(!w)return;
  const el=document.createElement('div');el.className='toast '+type;
  el.innerHTML='<span class="toast-ico">'+esc(icons[type]||'\u2139')+'</span><div class="toast-body"><div class="toast-title">'+esc(title||def[type])+'</div><div class="toast-msg">'+esc(msg)+'</div></div>';
  w.appendChild(el);

  setTimeout(function(){el.style.animation='tOut .3s ease forwards';setTimeout(function(){el.remove();},300);},dur);
}

function applyBidFilters(){
  var f=records.slice();
  if(bidFilters.type)f=f.filter(function(r){return r.type===bidFilters.type;});
  if(bidFilters.status)f=f.filter(function(r){return r.status===bidFilters.status;});
  if(bidFilters.region)f=f.filter(function(r){return r.region===bidFilters.region;});
  if(bidFilters.approved==='yes')f=f.filter(function(r){return r.approved;});
  if(bidFilters.approved==='no')f=f.filter(function(r){return !r.approved;});
  if(bidFilters.result==='successful')f=f.filter(function(r){return isSuccess(r);});
  if(bidFilters.result==='failed')f=f.filter(function(r){return FAIL_STATUSES.indexOf(r.status)>=0||r.rejected;});
  if(bidFilters.search){var q=bidFilters.search.toLowerCase();f=f.filter(function(r){return(r.description||'').toLowerCase().indexOf(q)>=0||(r.agency||'').toLowerCase().indexOf(q)>=0||(r.itbNo||'').toLowerCase().indexOf(q)>=0||(r.encodedBy||'').toLowerCase().indexOf(q)>=0||(r.region||'').toLowerCase().indexOf(q)>=0;});}
  if(bidFilters.dateFrom)f=f.filter(function(r){return new Date(r.date)>=new Date(bidFilters.dateFrom);});
  if(bidFilters.dateTo){var d=new Date(bidFilters.dateTo);d.setHours(23,59,59,999);f=f.filter(function(r){return new Date(r.date)<=d;});}
  if(sortCol){f.sort(function(a,b){var av=a[sortCol]||0,bv=b[sortCol]||0;if(sortCol==='net'){av=calcNet(a);bv=calcNet(b);}if(typeof av==='number')return sortDir==='asc'?av-bv:bv-av;return sortDir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));});}
  else f.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  return f;
}
function applySumFilters(){
  var f=records.slice();
  if(sumFilters.type!=='all')f=f.filter(function(r){return r.type===sumFilters.type;});
  if(sumFilters.region!=='all')f=f.filter(function(r){return r.region===sumFilters.region;});
  if(sumFilters.result==='successful')f=f.filter(function(r){return isSuccess(r);});
  if(sumFilters.result==='failed')f=f.filter(function(r){return FAIL_STATUSES.indexOf(r.status)>=0||r.rejected;});
  if(sumFilters.result==='approved')f=f.filter(function(r){return r.approved;});
  if(sumFilters.result==='rejected')f=f.filter(function(r){return r.rejected;});
  if(sumFilters.dateFrom)f=f.filter(function(r){return new Date(r.date)>=new Date(sumFilters.dateFrom);});
  if(sumFilters.dateTo){var d=new Date(sumFilters.dateTo);d.setHours(23,59,59,999);f=f.filter(function(r){return new Date(r.date)<=d;});}
  return f;
}

function getNextType(currentType, currentStatus){
  if(currentType==='Bid Opportunity'&&currentStatus==='Submitted For Approval')return'Submitted';
  if(currentType==='Submitted'&&currentStatus==='Approved')return'Participating';
  if(currentType==='Participating')return'Bid Result';
  if(currentType==='Bid Result'&&currentStatus==='Pass')return'Post Qualification';
  return null;
}

async function toggleApproved(rec){
  if(!can('approve')){toast('Only Admins can approve bids','error');return;}
  var na=!rec.approved;
  var updatedRec=Object.assign({},rec,{approved:na,rejected:false,lastEditedBy:user.displayName});
  if(na){updatedRec.type='Submitted';updatedRec.status='Approved';}
  else{updatedRec.type='Bid Opportunity';updatedRec.status='Submitted For Approval';}
  try{
    await updRec(rec.id,updatedRec);
    logAct('approve',na?'Approved: "'+rec.description+'" by '+user.displayName:'Revoked approval: "'+rec.description+'" by '+user.displayName);
    if(na)await addNotif('success','Approved by '+user.displayName+': "'+rec.description+'"',user.displayName);
    toast(na?'Approved!':'Approval revoked',na?'success':'info');
    renderFooterBar();refresh();
  }catch(e){toast('Failed to update','error');}
}

async function toggleRejected(rec){
  if(!can('reject')){toast('Only Admins can reject bids','error');return;}
  var nr=!rec.rejected;
  var updatedRec=Object.assign({},rec,{rejected:nr,approved:false,lastEditedBy:user.displayName});
  if(nr){updatedRec.type='Bid Opportunity';updatedRec.status='Rejected';}
  else{updatedRec.type='Bid Opportunity';updatedRec.status='Submitted For Approval';}
  try{
    await updRec(rec.id,updatedRec);
    logAct('reject',nr?'Rejected: "'+rec.description+'" by '+user.displayName:'Revoked rejection: "'+rec.description+'" by '+user.displayName);
    if(nr)await addNotif('danger','Rejected by '+user.displayName+': "'+rec.description+'"',user.displayName);
    toast(nr?'Rejected':'Rejection revoked',nr?'warning':'info');
    renderFooterBar();refresh();
  }catch(e){toast('Failed to update','error');}
}

async function toggleSuccess(rec){
  if(!can('edit')){toast('No permission','error');return;}
  if(rec.type!=='Submitted'){toast('Only Submitted bids can be marked','info');return;}
  var was=isSuccess(rec);
  var ns=was?'Approved':'NOA Received';
  try{
    await updRec(rec.id,Object.assign({},rec,{status:ns,lastEditedBy:user.displayName}));
    logAct('success',was?'Removed success: "'+rec.description+'"':'"'+rec.description+'" marked successful by '+user.displayName);
    if(!was)await addNotif('success','"'+rec.description+'" marked successful! [by '+user.displayName+']',user.displayName);
    toast(was?'Unmarked':'Marked successful!',was?'info':'success');
    renderFooterBar();refresh();
  }catch(e){toast('Failed','error');}
}

function renderDashboard(){
  var tABC=records.reduce(function(s,r){return s+(r.abc||0);},0);
  var tCOGS=records.reduce(function(s,r){return s+(r.cogs||0);},0);
  var tNet=records.reduce(function(s,r){return s+calcNet(r);},0);
  var tDed=records.reduce(function(s,r){return s+calcTotalDed(r);},0);
  var appr=records.filter(function(r){return r.approved;}).length;
  var rej=records.filter(function(r){return r.rejected;}).length;
  var sub=records.filter(function(r){return r.type==='Submitted';}).length;
  var succ=records.filter(function(r){return isSuccess(r);}).length;
  var fail=records.filter(function(r){return isFail(r);}).length;
  var wr=sub>0?(succ/sub*100).toFixed(1):'0.0';
  var mg=tABC>0?(tNet/tABC*100).toFixed(1):'0.0';
  var months=[],mA={},mC={},mN={};
  for(var i=5;i>=0;i--){var d=new Date();d.setMonth(d.getMonth()-i);d.setDate(1);var k=d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});months.push(k);mA[k]=0;mC[k]=0;mN[k]=0;}
  records.forEach(function(r){var k=new Date(r.date).toLocaleDateString('en-US',{month:'short',year:'2-digit'});if(k in mA){mA[k]+=(r.abc||0);mC[k]+=(r.cogs||0);mN[k]+=calcNet(r);}});
  var alerts=[];
  if(fail>0)alerts.push({t:'danger',m:fail+' bid(s) have Failed status'});

    +'<td style="width:140px"><input type="number" min="0" step="0.01" placeholder="0.00" value="'+(r.payable||0)+'" data-pi="'+i+'" data-pf="payable" style="text-align:right"/></td>'

function toggleVoucherNo(i){var sel=document.querySelector('[data-pi="'+i+'"][data-pf="payableStatus"]');var vc=document.getElementById('voucher_'+i);if(sel&&vc){vc.style.display=sel.value==='Paid'?'block':'none';if(sel.value!=='Paid')vc.value='';}}
function addPoRow(){var tbody=document.getElementById('po_body');if(!tbody)return;var i=tbody.querySelectorAll('tr').length;tbody.insertAdjacentHTML('beforeend',poEntryRow(i,{poNo:'',supplier:'',amount:0,payable:0,payableStatus:'',voucherNo:''}));}
function removePoRow(i){var row=document.getElementById('po_row_'+i);if(row)row.remove();recalcPoTotal();}
function recalcPoTotal(){
  var tbody=document.getElementById('po_body');if(!tbody)return;
  var total=0;
  tbody.querySelectorAll('[data-pf="amount"]').forEach(function(inp){total+=(+inp.value||0);});
  var el=document.getElementById('po_total');if(el)el.textContent=php(total);
}
function getPoEntries(){
  var tbody=document.getElementById('po_body');if(!tbody)return[];
  var rows=[];
  tbody.querySelectorAll('tr').forEach(function(row){
    var idx=row.id?row.id.split('_').pop():undefined;if(idx===undefined)return;
    var poNoEl=document.querySelector('[data-pi="'+idx+'"][data-pf="poNo"]');
    var supplierEl=document.querySelector('[data-pi="'+idx+'"][data-pf="supplier"]');
    var amountEl=document.querySelector('[data-pi="'+idx+'"][data-pf="amount"]');
    var payableEl=document.querySelector('[data-pi="'+idx+'"][data-pf="payable"]');
    var payableStatusEl=document.querySelector('[data-pi="'+idx+'"][data-pf="payableStatus"]');
    var voucherNoEl=document.querySelector('[data-pi="'+idx+'"][data-pf="voucherNo"]');
    rows.push({poNo:poNoEl?poNoEl.value:'',supplier:supplierEl?supplierEl.value:'',amount:amountEl?(+amountEl.value||0):0,payable:payableEl?(+payableEl.value||0):0,payableStatus:payableStatusEl?payableStatusEl.value:'',voucherNo:voucherNoEl?voucherNoEl.value:''});
  });
  return rows;
}

function getSlotData(type){
  return SLOT_LABELS.map(function(s,i){
    var inputs=document.querySelectorAll('[data-type="'+type+'"][data-slot="'+i+'"]');
    var no=inputs[0]?inputs[0].value:'';var date=inputs[1]?inputs[1].value:'';var enc=inputs[2]?inputs[2].value:'';
    return{slot:s,no:no,date:date?fromDateInput(date):'',encodedBy:enc};
  });
}

  var approved=can('approve')&&document.getElementById('fAppr')&&document.getElementById('fAppr').checked;
  var rejected=can('reject')&&document.getElementById('fRej')&&document.getElementById('fRej').checked;
  var finalType=type,finalStatus=gv('fStatus')||'Submitted For Approval';
  if(approved){finalType='Submitted';finalStatus='Approved';}
  else if(rejected){finalType='Bid Opportunity';finalStatus='Rejected';}
  return Object.assign({},editRec||{},{
    type:finalType,status:finalStatus,
    date:fromDateInput(gv('fDate'))||new Date().toISOString(),
    deadline:fromDateInput(gv('fDeadline')),
    description:(gv('fDesc')||'').trim(),
    itbNo:(gv('fITB')||'').trim(),
    agency:(gv('fAgency')||'').trim(),
    region:gv('fRegion')||'',
    encodedBy:(gv('fEncBy')||'').trim()||(user?user.displayName:''),
    abc:+(gv('fABC'))||0,
    awardedAbc:+(gv('fAwardedABC'))||0,
    cogs:+(gv('fCOGS'))||0,
    ded1:+(gv('fD1'))||0,
    ded2:+(gv('fD2'))||0,
    ded3:+(gv('fD3'))||0,
    ded4:+(gv('fD4'))||0,
    approved:approved,rejected:rejected,
    comments:gv('fComments')||'',
    noaDate:fromDateInput(gv('fNOA')),
    ntpDate:fromDateInput(gv('fNTP')),
    poReceivedDate:fromDateInput(gv('fPORec')),
    preBidAttended:gv('fPBA')||'',
    preBidAttendee:gv('fPBAtt')||'',
    bidDocsBoughtBy:gv('fDBB')||'',
    bidDocsPrice:+(gv('fDBP'))||0,
    bidDocsReviewedBy:gv('fDBR')||'',
    assemblingStarted:fromDateInput(gv('fAS')),
    assemblingCompleted:fromDateInput(gv('fAC')),
    submittedBy:gv('fSB')||'',
    submittedAt:fromDateTimeInput(gv('fSAt')),
    notedBy:gv('fNB')||'',
    notedAt:fromDateTimeInput(gv('fNAt')),
    poSentOn:fromDateInput(gv('fPSOn')),
    poSentBy:gv('fPSBy')||'',
    poEntries:getPoEntries(),
    deliveries:getSlotData('del'),
    collections:getSlotData('col'),
    lastEditedBy:user?user.displayName:'',
    noaPdfLink:editRec?editRec.noaPdfLink||'':'',
    ntpPdfLink:editRec?editRec.ntpPdfLink||'':'',
    poReceivedPdfLink:editRec?editRec.poReceivedPdfLink||'':'',
    poSupplierPdfLink:editRec?editRec.poSupplierPdfLink||'':''
  });
}

function wireFormPanel(editRec){
  var panel=document.getElementById('formPanel')||document.getElementById('editFormPanel');if(!panel)return;
  var fType=document.getElementById('fType');
  var fStatus=document.getElementById('fStatus');
  var fAppr=document.getElementById('fAppr');
  var fRej=document.getElementById('fRej');

  if(fAppr)fAppr.addEventListener('change',function(){if(fAppr.checked&&fRej)fRej.checked=false;});
  if(fRej)fRej.addEventListener('change',function(){if(fRej.checked&&fAppr)fAppr.checked=false;});

  var updateStatusOpts=function(){
    var t=fType.value;var cur=fStatus.value;
    fStatus.innerHTML=(STATUS_MAP[t]||STATUS_MAP['Bid Opportunity']).map(function(s){return'<option value="'+s+'"'+(s===cur?' selected':'')+'>'+s+'</option>';}).join('');
    var cs=document.getElementById('fCommentSection');
    if(cs)cs.style.display=COMMENT_STATUSES.indexOf(fStatus.value)>=0?'block':'none';
  };
  var showHideComment=function(){
    var cs=document.getElementById('fCommentSection');
    if(cs)cs.style.display=COMMENT_STATUSES.indexOf(fStatus.value)>=0?'block':'none';
  };
  var updateCalc=function(){
    var abc=+(gv('fABC'))||0;
    var cogs=+(gv('fCOGS'))||0;
    var d1=+(gv('fD1'))||0;
    var d2=+(gv('fD2'))||0;
    var d3=+(gv('fD3'))||0;
    var d4=+(gv('fD4'))||0;
    var awardedAbc=+(gv('fAwardedABC'))||0;
    var d1Amt=abc*d1/100;var d2Amt=d2;var d3Amt=abc*d3/100;var d4Amt=d4;
    var totalDed=d1Amt+d2Amt+d3Amt+d4Amt;
    var net=abc-cogs-totalDed;
    var mg=abc>0?(net/abc*100).toFixed(1):'0.0';
    var nc=net>=0?'var(--gr)':'var(--rd)';
    var se=function(id,val,col){var el=document.getElementById(id);if(!el)return;if(val!==undefined)el.textContent=val;if(col)el.style.color=col;};
    se('pvABC',php(abc));se('pvAwardedABC',php(awardedAbc));se('pvCOGS',php(cogs));
    se('pvD1Amt',php(d1Amt));se('pvD2Amt',php(d2Amt));se('pvD3Amt',php(d3Amt));se('pvD4Amt',php(d4Amt));
    se('pvDed',php(totalDed));se('pvNet',php(net),nc);se('pvMg',mg+'%',nc);
  };
  fType.onchange=updateStatusOpts;
  fStatus.onchange=showHideComment;
  ['fABC','fCOGS','fD1','fD2','fD3','fD4','fAwardedABC'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('input',updateCalc);});

  var cancelFn=function(){showForm=false;renderBids();};
  var fc=document.getElementById('fCancel');if(fc)fc.addEventListener('click',cancelFn);
  var fc2=document.getElementById('fCancel2');if(fc2)fc2.addEventListener('click',cancelFn);

  document.getElementById('fSave').onclick=async function(){
    var rec=collectFormData(editRec);
    if(!rec.description){toast('Please enter a description / project name','error');return;}
    if(!confirm(editRec?'Are you sure you want to save changes to this record?':'Are you sure you want to add this new record?'))return;
    var btn=document.getElementById('fSave');btn.disabled=true;btn.textContent='Saving...';
    try{
      var savedId=editRec?editRec.id:null;
      if(editRec){await updRec(editRec.id,rec);savedId=editRec.id;logAct('edit','Edited: "'+rec.description+'" by '+user.displayName);await addNotif('info','Edited by '+user.displayName+': "'+rec.description+'"',user.displayName);}
      else{var res=await saveRec(rec);logAct('add','Added: "'+rec.description+'" ('+rec.type+') by '+user.displayName);
        if(res&&res.id){savedId=res.id;}
        else if(res&&res.records){var nr=res.records.find(function(x){return x.description===rec.description;});if(nr)savedId=nr.id;}
        var n=calcNet(rec);if(rec.abc>0&&n/rec.abc<0.05)await addNotif('warning','Low margin on new record: "'+rec.description+'" [by '+user.displayName+']',user.displayName);}
      if(rec.approved)await addNotif('success','Approved: "'+rec.description+'" [by '+user.displayName+']',user.displayName);
      if(rec.rejected)await addNotif('danger','Rejected: "'+rec.description+'" [by '+user.displayName+']',user.displayName);
      await doPdfUploads(btn,savedId||(editRec?editRec.id:null),rec.description);
      toast(editRec?'Record updated!':'Record saved!','success');
      showForm=false;renderBids();renderFooterBar();
    }catch(e){toast('Save failed: '+(e.message||e),'error');btn.disabled=false;btn.textContent=editRec?'Save Changes':'Save Record';}
  };
}

var PDF_MAX_SIZE=10*1024*1024;
function doPdfUploads(btn,recId,projectName){
  if(!recId)return Promise.resolve();
  var pdfInputs=[
    {inputId:'fNoaPdf',docType:'noa'},
    {inputId:'fNtpPdf',docType:'ntp'},
    {inputId:'fPoRecPdf',docType:'po'},
    {inputId:'fPoSupplierPdf',docType:'po_supplier'}
  ];
  var chain=Promise.resolve();
  pdfInputs.forEach(function(pu){
    chain=chain.then(function(){
      var fileInput=document.getElementById(pu.inputId);
      if(!fileInput||!fileInput.files||fileInput.files.length===0)return;
      var file=fileInput.files[0];
      if(file.size>PDF_MAX_SIZE){toast(pu.docType.toUpperCase()+' PDF too large (max 10MB)','error');return;}
      if(btn)btn.textContent='Uploading '+pu.docType.toUpperCase()+' PDF...';
      return uploadPdfFile(recId,file,projectName,pu.docType);
    });
  });
  return chain;
}

function uploadPdfFile(recordId,file,projectName,docType){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var dataUrl=reader.result;
        if(!dataUrl||dataUrl.indexOf(',')< 0){reject('Invalid file data');return;}
        var base64=dataUrl.split(',')[1];
        if(!base64){reject('Empty file data');return;}
        google.script.run
          .withSuccessHandler(function(res){
            if(res&&res.success){
              if(res.records)records=res.records;
              toast(docType.toUpperCase()+' PDF uploaded!','success');
              resolve(res);
            }else{
              toast('PDF upload failed: '+(res?res.error:'Unknown error'),'error');
              resolve(res);
            }
          })
          .withFailureHandler(function(err){
            toast('PDF upload error: '+err,'error');
            resolve({success:false,error:String(err)});
          })
          .uploadAndLinkPdf(recordId,base64,file.name,projectName,docType);
      }catch(ex){reject(String(ex));}
    };
    reader.onerror=function(){reject('Could not read file');};
    reader.readAsDataURL(file);
  });
}

function attachRowEvents(){
  document.querySelectorAll('.row-check').forEach(function(cb){
    if(cb.id==='selAll')return;
    cb.onchange=function(e){
      if(e.target.checked)selectedRows.add(cb.dataset.id);else selectedRows.delete(cb.dataset.id);
      var bb=document.getElementById('bulkBar');if(bb)bb.classList.toggle('show',selectedRows.size>0);
      var bl=document.querySelector('.bulk-label');if(bl)bl.textContent=selectedRows.size+' selected';
    };
  });
  document.querySelectorAll('.approve-cb').forEach(function(cb){
    cb.onchange=async function(){var r=records.find(function(x){return x.id===cb.dataset.id;});if(r){cb.disabled=true;await toggleApproved(r);}};
  });
  document.querySelectorAll('.reject-cb').forEach(function(cb){
    cb.onchange=async function(){var r=records.find(function(x){return x.id===cb.dataset.id;});if(r){cb.disabled=true;await toggleRejected(r);}};
  });
  document.querySelectorAll('.success-cb').forEach(function(cb){
    cb.onchange=async function(){var r=records.find(function(x){return x.id===cb.dataset.id;});if(r){cb.disabled=true;await toggleSuccess(r);}};
  });
  document.querySelectorAll('.view-btn').forEach(function(btn){btn.onclick=function(){var r=records.find(function(x){return x.id===btn.dataset.id;});if(r)showDetailModal(r);};});
  document.querySelectorAll('.edit-btn').forEach(function(btn){btn.onclick=function(){var r=records.find(function(x){return x.id===btn.dataset.id;});if(r)showEditModal(r);};});
  document.querySelectorAll('.del-btn').forEach(function(btn){btn.onclick=async function(){
    var r=records.find(function(x){return x.id===btn.dataset.id;});if(!r)return;
    if(!confirm('Delete "'+r.description+'"?\nThis action cannot be undone.'))return;
    btn.disabled=true;
    try{await delRec(btn.dataset.id);logAct('del','Deleted: "'+r.description+'" by '+user.displayName);toast('Record deleted','info');renderBids();renderFooterBar();}
    catch(e){toast('Delete failed','error');btn.disabled=false;}
  };});
  document.querySelectorAll('.print-btn').forEach(function(btn){btn.onclick=function(){var r=records.find(function(x){return x.id===btn.dataset.id;});if(r)printPO(r);};});
}

function showEditModal(record){
  showForm=false;
  var ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML='<div class="modal lg">'
    +'<div class="modal-head"><div class="modal-title">Edit: '+esc(record.description)+'</div><button class="modal-close" id="emCls">\u2715</button></div>'
    +'<div class="modal-body" id="emBody"></div></div>';
  document.body.appendChild(ov);
  document.getElementById('emBody').innerHTML=renderFormPanel(record).replace('id="formPanel"','id="editFormPanel"');
  var close=function(){ov.remove();};
  document.getElementById('emCls').onclick=close;
  ov.onclick=function(e){if(e.target===ov)close();};
  wireFormPanel(record);
  var fc=document.getElementById('fCancel');if(fc)fc.onclick=close;
  var fc2=document.getElementById('fCancel2');if(fc2)fc2.onclick=close;
  document.getElementById('fSave').onclick=async function(){
    var rec=collectFormData(record);
    if(!rec.description){toast('Description required','error');return;}
    if(!confirm('Are you sure you want to save changes to this record?'))return;
    var btn=document.getElementById('fSave');btn.disabled=true;btn.textContent='Saving...';
    try{
      await updRec(record.id,rec);
      logAct('edit','Edited: "'+rec.description+'" -> '+rec.status+' by '+user.displayName);
      if(rec.approved)await addNotif('success','Approved: "'+rec.description+'" [by '+user.displayName+']',user.displayName);
      if(rec.rejected)await addNotif('danger','Rejected: "'+rec.description+'" [by '+user.displayName+']',user.displayName);
      await doPdfUploads(btn,record.id,rec.description);
      toast('Record updated!','success');close();renderFooterBar();refresh();
    }catch(e){toast('Update failed: '+(e.message||e),'error');btn.disabled=false;btn.textContent='Save Changes';}
  };
}

function renderSummary(){

  var sub=f.filter(function(r){return r.type==='Submitted';}).length;

}

function exportXls(rows){
  var data=[
    ['Date','Description','ITB No.','Agency','Region','Type','Status','Encoded By','Last Edited By',
     'Deadline','Awarded ABC (\u20b1)','Pre-Bid ABC (\u20b1)','COGs (\u20b1)',
     'VAT (%)','VAT (\u20b1)','EWT (\u20b1)','Comm.Fee (%)','Comm.Fee (\u20b1)','Direct Exp. (\u20b1)','Total Deductions (\u20b1)',
     'Net (\u20b1)','Net Margin (%)','Approved','Rejected','Comments',
     'NOA Date','NTP Date','PO Received Date',
     'NOA PDF Link','NTP PDF Link','PO Received PDF Link','PO Supplier PDF Link',
     'Pre-Bid','Attendee','Docs Bought By','Docs Price','Docs Reviewed By',
     'Assembling Started','Assembling Completed','Submitted By','Submission Date',
     'Noted By','Noted Date','PO Sent On','PO Sent By',
     'PO Entries (No. & Amounts)']
  ];
  rows.forEach(function(r){
    var net=calcNet(r);var abc=r.abc||0;var tDed=calcTotalDed(r);
    var d1Amt=abc*(r.ded1||0)/100;var d3Amt=abc*(r.ded3||0)/100;
    var mg=abc>0?(net/abc*100).toFixed(2)+'%':'0%';
    var poStr=(r.poEntries||[]).filter(function(e){return e.poNo||e.amount;}).map(function(e){return(e.poNo||'')+': \u20b1'+(e.amount||0)+(e.supplier?' ('+e.supplier+')':'');}).join(' | ');
    data.push([fmtD(r.date),r.description,r.itbNo||'',r.agency||'',r.region||'',r.type,r.status,r.encodedBy||'',r.lastEditedBy||'',
      r.deadline?fmtD(r.deadline):'',abc,r.awardedAbc||0,r.cogs||0,
      r.ded1||0,d1Amt,r.ded2||0,r.ded3||0,d3Amt,r.ded4||0,tDed,
      net,mg,r.approved?'YES':'NO',r.rejected?'YES':'NO',r.comments||'',
      r.noaDate?fmtD(r.noaDate):'',r.ntpDate?fmtD(r.ntpDate):'',r.poReceivedDate?fmtD(r.poReceivedDate):'',
      r.noaPdfLink||'',r.ntpPdfLink||'',r.poReceivedPdfLink||'',r.poSupplierPdfLink||'',
      r.preBidAttended||'',r.preBidAttendee||'',r.bidDocsBoughtBy||'',r.bidDocsPrice||0,r.bidDocsReviewedBy||'',
      r.assemblingStarted?fmtD(r.assemblingStarted):'',r.assemblingCompleted?fmtD(r.assemblingCompleted):'',
      r.submittedBy||'',r.submittedAt?fmtDT(r.submittedAt):'',
      r.notedBy||'',r.notedAt?fmtDT(r.notedAt):'',
      r.poSentOn?fmtD(r.poSentOn):'',r.poSentBy||'',poStr]);
  });
  var ws=XLSX.utils.aoa_to_sheet(data);
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bids');
  XLSX.writeFile(wb,'BLS-BidTracker_'+new Date().toISOString().split('T')[0]+'.xlsx');
  logAct('export','Exported to Excel by '+user.displayName);toast('Excel downloaded!','success');
}
